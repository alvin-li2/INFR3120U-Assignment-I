<body>
    <div id="wrapper">
        <h1>Contact me here!</h1>
        <form action="mailto:alvin.li@ontariotechu.net?subject=Feedback Regarding Website" method="post"
            enctype="text/plain" name="feedback_form">
            <p>
                <label for="firstName">Enter your First Name</label>
                <input type="text" id="firstName" size="32" placeholder="Enter your First Name" required>
            </p>
            <p>
                <label for="lastName">Enter your Last Name</label>
                <input type="text" id="lastName" size="32" placeholder="Enter your Last Name" required>
            </p>
            <p>
                <label for="email">Enter your Email Address</label>
                <input type="email" id="email" size="32" placeholder="Enter your Email Address" required>
            </p>
            <p>
                <label for="phone">Enter your Phone Number Here (optional)</label>
                <input type="tel" id="phone" size="32" placeholder="Enter your Phone Number Here">
            </p>
            <p>
                <label for="message">Enter your Message</label><br>
                <textarea name="message" cols="60" rows="8" placeholder="Enter your Message Here" required></textarea>
            </p>
            <p>
                <input type="submit" value="Submit">
            </p>
    </div>
</body>
